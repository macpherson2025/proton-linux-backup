# Proton Linux Backup
# Example configuration — safe to publish on GitHub

# Local directory containing files to back up
SOURCE_DIR="$HOME/Documents"

# Configured rclone remote and destination directory
# Proton Drive is the default, but other providers are supported
DEST_REMOTE="protonsecure"
DEST_PATH="Projects"

# Version history location on the same remote
VERSIONS_PATH="Versions"

# Local directory for backup logs
LOG_DIR="$HOME/.local/state/proton-linux-backup/logs"

# Number of simultaneous file transfers
TRANSFERS=1

# Backup verification
# quick = metadata comparison
# full  = download and compare file contents
VERIFY_MODE="quick"

# Version retention (reserved for a future release)
# No automatic deletion is currently implemented
RETENTION_DAYS=30
